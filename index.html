<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Affiliate Showcase - Public</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .hero {
      background-color: #005bb5;
      padding: 60px 20px;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }
    .hero h2 {
      font-size: 36px;
      margin: 0;
    }
    .hero p {
      font-size: 18px;
      margin-top: 10px;
    }
    /* Tighter grid spacing */
    .grid-container {
      max-width: 1200px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      padding: 10px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 5px;
    }
    .product-card h3 {
      font-size: 18px;
      margin: 5px 0;
    }
    /* Reduced font size for current price (from 28px to 24px) */
    .current-price {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 5px 0;
    }
    .discount {
      font-size: 20px;
      color: red;
      font-weight: bold;
      margin-left: 5px;
    }
    .list-price {
      font-size: 14px;
      text-decoration: line-through;
      color: #999;
      margin: 2px 0;
    }
    .limited-time {
      font-size: 12px;
      color: red;
      margin-top: 2px;
    }
    .buy-button {
      display: inline-block;
      background-color: #ff9900;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 5px;
    }
    .buy-button:hover {
      background-color: #cc7a00;
    }
    footer {
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
      font-size: 12px;
      color: #555;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h2>Welcome to Trend Bargain$</h2>
    <p>Explore trending deals!</p>
  </div>

  <div class="grid-container" id="productList"></div>

  <footer>
    As an Amazon Associate, I earn from qualifying purchases. Prices and availability are subject to change without notice.<br>
    &copy; <span id="currentYear"></span> All rights reserved.
  </footer>

  <script>
    function getProducts() {
      return JSON.parse(localStorage.getItem("products")) || [];
    }

    function renderProducts() {
      const container = document.getElementById("productList");
      container.innerHTML = "";
      const products = getProducts();
      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" />
          <h3>${product.name}</h3>
          <p class="current-price">$${product.currentPrice.toFixed(2)}
            <span class="discount">-${Math.ceil((product.listPrice - product.currentPrice) / product.listPrice * 100)}%</span>
          </p>
          <p class="list-price">Was: $${product.listPrice.toFixed(2)}</p>
          <p class="limited-time">Limited Time Deal!</p>
          <a class="buy-button" href="${product.affiliateLink}" target="_blank">Buy on Amazon</a>
        `;
        container.appendChild(card);
      });
    }

    window.onload = () => {
      renderProducts();
      document.getElementById("currentYear").textContent = new Date().getFullYear();
    };
  </script>
</body>
</html>
