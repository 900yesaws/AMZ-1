<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Affiliate Showcase - Private</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .hero {
      background-color: #005bb5;
      padding: 60px 20px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }
    .hero h2 {
      font-size: 36px;
      margin: 0;
    }
    .hero p {
      font-size: 18px;
      margin-top: 10px;
    }
    form {
      max-width: 800px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      background-color: #0073e6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #005bb5;
    }
    .grid-container {
      max-width: 1200px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      padding: 10px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 5px;
    }
    .product-card h3 {
      font-size: 18px;
      margin: 5px 0;
    }
    /* Reduced current price from 28px to 24px */
    .current-price {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 5px 0;
    }
    .discount {
      font-size: 20px;
      color: red;
      font-weight: bold;
      margin-left: 5px;
    }
    .list-price {
      font-size: 14px;
      text-decoration: line-through;
      color: #999;
      margin: 2px 0;
    }
    .limited-time {
      font-size: 12px;
      color: red;
      margin-top: 2px;
    }
    .buy-button {
      display: inline-block;
      background-color: #ff9900;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 5px;
    }
    .buy-button:hover {
      background-color: #cc7a00;
    }
    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 5px;
    }
    .edit-button, .delete-button {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }
    .edit-button {
      background-color: #ffc107;
      color: white;
    }
    .edit-button:hover {
      background-color: #e0a800;
    }
    .delete-button {
      background-color: #dc3545;
      color: white;
    }
    .delete-button:hover {
      background-color: #c82333;
    }
    .snapshot-buttons {
      max-width: 800px;
      margin: 10px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .snapshot-buttons button {
      background-color: #28a745;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .snapshot-buttons button:hover {
      background-color: #218838;
    }
    footer {
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
      font-size: 12px;
      color: #555;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h2>Welcome to Trend Bargain$</h2>
    <p>Discover top bargains and trending deals all in one place!</p>
  </div>

  <form id="productForm">
    <input type="text" id="productName" placeholder="Product Name" required />
    <input type="url" id="productImage" placeholder="Image URL" required />
    <input type="url" id="affiliateLink" placeholder="Affiliate Link (e.g., https://amzn.to/...)" required />
    <input type="number" id="currentPrice" placeholder="Current Price" step="0.01" required />
    <input type="number" id="listPrice" placeholder="List Price" step="0.01" required />
    <button type="submit">Add Product</button>
  </form>

  <div class="snapshot-buttons">
    <button id="saveSnapshot1">Save Snapshot (Ref-1)</button>
    <button id="revertSnapshot1">Revert to Ref-1</button>
    <button id="saveSnapshot2">Save Snapshot (Ref-2)</button>
    <button id="revertSnapshot2">Revert to Ref-2</button>
    <button id="saveSnapshot3">Save Snapshot (Ref-3)</button>
    <button id="revertSnapshot3">Revert to Ref-3</button>
  </div>

  <div class="grid-container" id="productList"></div>

  <footer>
    As an Amazon Associate, I earn from qualifying purchases. Prices and availability are subject to change without notice.<br>
    &copy; <span id="currentYear"></span> All rights reserved.
  </footer>

  <script>
    // Retrieve products from localStorage or return empty array
    function getProducts() {
      return JSON.parse(localStorage.getItem("products")) || [];
    }

    // Save products array to localStorage
    function saveProducts(products) {
      localStorage.setItem("products", JSON.stringify(products));
    }

    // Save a snapshot under a given reference (e.g., "ref-1")
    function saveSnapshot(refName) {
      const products = getProducts();
      localStorage.setItem(refName, JSON.stringify(products));
      alert(`Snapshot saved as "${refName}".`);
    }

    // Revert products using a saved snapshot reference
    function revertSnapshot(refName) {
      const snapshot = localStorage.getItem(refName);
      if (snapshot) {
        localStorage.setItem("products", snapshot);
        renderProducts();
        alert(`Reverted to snapshot "${refName}".`);
      } else {
        alert(`No snapshot found for "${refName}".`);
      }
    }

    // Render products on the page
    function renderProducts() {
      const container = document.getElementById("productList");
      container.innerHTML = "";
      const products = getProducts();
      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" />
          <h3>${product.name}</h3>
          <p class="current-price">$${product.currentPrice.toFixed(2)}
            <span class="discount">-${Math.ceil((product.listPrice - product.currentPrice) / product.listPrice * 100)}%</span>
          </p>
          <p class="list-price">Was: $${product.listPrice.toFixed(2)}</p>
          <p class="limited-time">Limited Time Deal!</p>
          <a class="buy-button" href="${product.affiliateLink}" target="_blank">Buy on Amazon</a>
          <div class="button-group">
            <button class="edit-button" onclick="editProduct(${product.id})">Edit</button>
            <button class="delete-button" onclick="deleteProduct(${product.id})">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Add a new product
    function addProduct(product) {
      const products = getProducts();
      products.push(product);
      saveProducts(products);
      renderProducts();
    }

    // Load product details for editing and remove from the list
    function editProduct(id) {
      const products = getProducts();
      const product = products.find((p) => p.id === id);
      if (product) {
        document.getElementById("productName").value = product.name;
        document.getElementById("productImage").value = product.image;
        document.getElementById("affiliateLink").value = product.affiliateLink;
        document.getElementById("currentPrice").value = product.currentPrice;
        document.getElementById("listPrice").value = product.listPrice;
        deleteProduct(id);
      }
    }

    // Delete product by id
    function deleteProduct(id) {
      const products = getProducts().filter((p) => p.id !== id);
      saveProducts(products);
      renderProducts();
    }

    // Handle form submission to add/update product
    document.getElementById("productForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const product = {
        id: Date.now(),
        name: document.getElementById("productName").value,
        image: document.getElementById("productImage").value,
        affiliateLink: document.getElementById("affiliateLink").value,
        currentPrice: parseFloat(document.getElementById("currentPrice").value),
        listPrice: parseFloat(document.getElementById("listPrice").value)
      };
      addProduct(product);
      e.target.reset();
    });

    window.onload = () => {
      renderProducts();
      document.getElementById("currentYear").textContent = new Date().getFullYear();
    };

    // Set up snapshot button events
    document.getElementById("saveSnapshot1").addEventListener("click", () => saveSnapshot("ref-1"));
    document.getElementById("revertSnapshot1").addEventListener("click", () => revertSnapshot("ref-1"));
    document.getElementById("saveSnapshot2").addEventListener("click", () => saveSnapshot("ref-2"));
    document.getElementById("revertSnapshot2").addEventListener("click", () => revertSnapshot("ref-2"));
    document.getElementById("saveSnapshot3").addEventListener("click", () => saveSnapshot("ref-3"));
    document.getElementById("revertSnapshot3").addEventListener("click", () => revertSnapshot("ref-3"));
  </script>
</body>
</html>
